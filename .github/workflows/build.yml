name: build

# Reusable pipeline: packs OpenTok.Net.Android and its OpenTok.Net.webrtc.Dependency.Android
# dependency (each at its own version from Directory.Build.props, optionally suffixed for
# prereleases), validates the result, builds the MAUI sample against the packed packages, and runs
# the emulator smoke tests.

on:
  workflow_call:
    inputs:
      verify:
        description: >
          Whether to run the verification jobs — package validation, the sample builds, the
          Release link checks and the e2e suites. Pull requests leave it at true, and are the only
          place any of this runs. Releases pass false: the tagged commit was already verified on
          its pull request, so a tag packs and publishes and nothing more. The gate is the same
          input, with the same name and the same meaning, in every repository.
        required: false
        default: true
        type: boolean
      suffix:
        description: >
          Optional prerelease suffix (e.g. beta.12.34) appended to every package's own version.
          OpenTok and webrtc sit on independent native version lines, so there is no single version
          to stamp — each packs at its own pin from Directory.Build.props.
        required: false
        default: ''
        type: string
      e2e-target-frameworks:
        description: >
          Which target frameworks the emulator smoke tests run against, as a JSON array. Defaults
          to the two extremes: net8, the oldest asset set and the one that resolves its .aar
          through the DownloadFile fallback rather than AndroidMavenLibrary (see
          src/OpenTok.Binding.props), and net10, whose assets are produced by the merge step in
          BuildNugets.sh and so are the only ones that could be grafted in wrong. net9 sits between
          them and comes out of the same pack pass as net8, so testing it too would buy little for
          the runner minutes.
        required: false
        default: '["net8.0-android34.0", "net10.0-android36.0"]'
        type: string
      e2e-api-level:
        description: Android API level the emulator smoke test boots.
        required: false
        default: 35
        type: number
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  pack:
    name: pack
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # 9.0.x packs net8+net9 (global.json pins it) and 10.0.x packs net10.
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install Android workloads for every SDK band
        run: |
          for major in 9 10; do
            dir="${RUNNER_TEMP}/sdk${major}"
            mkdir -p "${dir}"
            sdk=$(dotnet --list-sdks | grep "^${major}\." | tail -1 | cut -d' ' -f1)
            ( cd "${dir}" \
              && dotnet new globaljson --sdk-version "${sdk}" --force \
              && dotnet workload install android )
          done

      - name: Set up Android SDK platforms
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 platforms;android-35 platforms;android-36'

      - name: Cache the Maven-resolved .aar
        uses: actions/cache@v4
        with:
          # AndroidMavenLibrary's cache (net9+) plus the net8.0-android34.0 DownloadFile fallback's
          # obj/ output (see src/OpenTok.Binding.props) — both keyed on the pin, so a version bump
          # invalidates the cache instead of silently reusing the wrong .aar. webrtc's .aar alone is
          # 243 MB, so this is the difference between a ~1 minute restore and a ~10 minute one.
          path: |
            ~/.cache/dotnet-android/MavenCacheDirectory
            src/*/obj/*/maven
          key: opentok-android-maven-${{ hashFiles('Directory.Build.props') }}

      - name: Pack
        run: |
          if [ -n "${{ inputs.suffix }}" ]; then
            ./build/BuildNugets.sh --suffix "${{ inputs.suffix }}"
          else
            ./build/BuildNugets.sh
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7

  validate:
    name: validate packages
    if: ${{ inputs.verify }}
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Run package tests
        run: dotnet test tests/OpenTok.Net.Android.PackageTests --logger 'trx;LogFileName=package-tests.trx'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-test-results
          path: '**/*.trx'
          if-no-files-found: ignore
          retention-days: 7

  sample:
    name: build sample app
    timeout-minutes: 30
    needs: pack
    if: ${{ inputs.verify }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # opentok-android-sdk's own classes.jar is Java 17 class file format; javac needs a JDK new
      # enough to read it — see tests/OpenTok.Net.Android.DeviceTests's own .csproj comment for the
      # full story of why net8 needs this explicitly and net9/net10 pick it up through $JAVA_HOME
      # on their own.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The sample targets net10.0-android36.0 and so needs the .NET 10 SDK, not the .NET 9 one
      # global.json pins.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the MAUI workload for the .NET 10 band
        run: |
          # Workloads are installed per SDK band, and the SDK is resolved from the working
          # directory - so this has to run from the same scratch global.json the build uses. At the
          # repository root global.json pins .NET 9, so installing there puts maui-android on a
          # band the build never sees, and the build fails with NETSDK1147 telling you to install a
          # workload you just installed.
          dir="${RUNNER_TEMP}/sample-sdk"
          mkdir -p "${dir}"
          ( cd "${dir}" \
            && dotnet new globaljson \
                 --sdk-version "$(dotnet --list-sdks | grep '^10\.' | tail -1 | cut -d' ' -f1)" --force \
            && dotnet workload install maui-android )

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      # The sample consumes the packed package exactly as a MAUI consumer would: it restores from
      # artifacts/ (see NuGet.config) and links against Com.Opentok.Android.Publisher directly, so
      # it is the only thing that checks the API is still usable the way the README documents.
      - name: Build the sample against the packed packages
        run: |
          . ./build/pins.sh
          s="${{ inputs.suffix != '' && format('-{0}', inputs.suffix) || '' }}"
          # From the same scratch directory the workload was installed into, for the same reason:
          # the SDK - and therefore the workload set - is resolved from the working directory.
          ( cd "${RUNNER_TEMP}/sample-sdk" \
            && dotnet build "${GITHUB_WORKSPACE}/samples/OpenTok.Sample.Android/OpenTok.Sample.Android.csproj" \
                 --configuration Release \
                 -p:OpenTokDevicePackageVersion="${OPENTOK_PACKAGE_VERSION}${s}" )

  # Proves the transformers package's native payload survives a Release build and reaches the APK.
  #
  # Nothing else in this pipeline can. The package tests read the .nupkg and so only see what was
  # packed; the emulator smoke tests build Debug and do not reference the package at all. What
  # happens in between is the part that goes wrong: a Release build runs r8 and the Android
  # packaging step, and a native library that fails to be picked out of an .aar — or is dropped
  # because nothing appears to reference it, which is exactly the shape of a payload-only package —
  # produces an APK that installs and then dies on the first transformer with
  # UnsatisfiedLinkError.
  #
  # Release rather than Debug for the same reason the iOS side links for a device: Debug leaves the
  # trimming and packaging paths that could drop it switched off.
  #
  # Both legs matter, and for different reasons. This package ships net8 and net10 asset folders
  # but not net9 (a size limit — see the transformers .csproj), so:
  #
  #   net9   resolves the net8 folder by NuGet's normal fallback. The leg that proves an app
  #          targeting a framework this package does not name still gets the whole payload.
  #   net10  resolves its own folder, which the .NET 10 SDK builds differently — it is the band
  #          that wanted to emit a duplicate project-level .aar, suppressed in the .csproj. The leg
  #          that proves suppressing it did not take the payload with it.
  transformers-packaging:
    name: package the transformers into an APK (Release, ${{ matrix.target-framework }})
    timeout-minutes: 45
    needs: pack
    if: ${{ inputs.verify }}
    runs-on: ubuntu-latest
    strategy:
      # fail-fast off for the same reason as e2e: one leg failing and both legs failing point at
      # very different causes — a resolution problem versus a packing problem.
      fail-fast: false
      matrix:
        include:
          - target-framework: net9.0-android35.0
            dotnet-version: 9.0.x
            sdk-major: '9'
            android-platform: android-35
          - target-framework: net10.0-android36.0
            dotnet-version: 10.0.x
            sdk-major: '10'
            android-platform: android-36
    steps:
      - uses: actions/checkout@v4

      # opentok-android-sdk's classes.jar is Java 17 class file format — see the sample job.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      # Both legs build from a scratch directory carrying their own global.json, not just the net10
      # one — the workload has to be installed on the same band the build resolves, and the SDK is
      # resolved from the working directory. See the sample job for the failure this avoids: the
      # repository root pins .NET 9, so a net10 build started there installs the workload on a band
      # it never sees and then fails with NETSDK1147 naming the workload it just installed.
      - name: Install the Android workload for the .NET ${{ matrix.sdk-major }} band
        run: |
          dir="${RUNNER_TEMP}/transformers-sdk"
          mkdir -p "${dir}"
          ( cd "${dir}" \
            && dotnet new globaljson \
                 --sdk-version "$(dotnet --list-sdks | grep '^${{ matrix.sdk-major }}\.' | tail -1 | cut -d' ' -f1)" --force \
            && dotnet workload install android )

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;${{ matrix.android-platform }}'

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Build the device tests with the transformers package and inspect the APK
        run: |
          . ./build/pins.sh
          s="${{ inputs.suffix != '' && format('-{0}', inputs.suffix) || '' }}"
          tfm=${{ matrix.target-framework }}
          tests="${GITHUB_WORKSPACE}/tests/OpenTok.Net.Android.DeviceTests"

          # -p:OpenTokDeviceTargetFramework rather than --framework: the project computes its
          # TargetFrameworks from that property, and --framework only selects among the ones it
          # already built, so asking for a framework outside the band's default list fails before
          # it starts. From the scratch directory, for the reason the workload step gives.
          ( cd "${RUNNER_TEMP}/transformers-sdk" \
            && dotnet build "${tests}" \
                 --configuration Release \
                 -p:OpenTokDeviceTargetFramework="${tfm}" \
                 -p:RuntimeIdentifier=android-arm64 \
                 -p:OpenTokDevicePackageVersion="${OPENTOK_PACKAGE_VERSION}${s}" \
                 -p:OpenTokIncludeTransformers=true )

          apk="$(find "${tests}/bin/Release/${tfm}" -name '*-Signed.apk' -o -name '*.apk' | head -1)"
          if [ -z "${apk}" ]; then
            echo "::error::no APK was produced"
            exit 1
          fi
          echo "inspecting ${apk}"

          # arm64-v8a specifically: it is the only ABI a modern device actually runs, and the one
          # whose 16 KB page alignment Android 15 requires. A build that packaged only the
          # armeabi-v7a copies would look fine to a file count.
          missing=0
          for lib in libopentok_transformers.so libmltransformers.so libmltransformersaudionoisesuppression.so; do
            if unzip -l "${apk}" | grep -q "lib/arm64-v8a/${lib}"; then
              echo "  ok      ${lib}"
            else
              echo "::error::${lib} is missing from lib/arm64-v8a/ in the APK"
              missing=1
            fi
          done

          # The models are assets, not libraries, and travel by a different path — so they are a
          # separate way for the same package to arrive useless.
          for model in selfie_segmentation.tflite ns_model_1.tflite ns_model_2.tflite; do
            if unzip -l "${apk}" | grep -q "${model}"; then
              echo "  ok      ${model}"
            else
              echo "::error::${model} is missing from the APK's assets"
              missing=1
            fi
          done

          exit "${missing}"

  e2e:
    name: emulator smoke test (${{ matrix.target-framework }})
    if: ${{ inputs.verify }}
    timeout-minutes: 60
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      # fail-fast off: when one leg breaks it is worth knowing whether the other did too, since
      # "net8 only" and "both" point at very different causes.
      fail-fast: false
      matrix:
        target-framework: ${{ fromJSON(inputs.e2e-target-frameworks) }}
    steps:
      - uses: actions/checkout@v4

      # See the sample job's own comment on why this is needed at all — matters here too, since
      # the device test app compiles the same OpenTok listener glue the sample does.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # 8.0.x is here for the net8 matrix leg only - see the workload step below.
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install Android workloads
        run: |
          # The device app is built for the target framework under test, and the band that owns it
          # is decided by the *API level* rather than the .NET version - the .NET 9 band has API 34
          # reference packs but no API 34 runtime packs, so a net8 app compiles and then fails to
          # package. See run-emulator-tests.sh. Install all three bands' workloads so any target
          # framework in the matrix can build.
          for sdk in 8 9 10; do
            version="$(dotnet --list-sdks | grep "^${sdk}\." | tail -1 | cut -d' ' -f1)"
            [ -z "${version}" ] && continue

            mkdir -p "${RUNNER_TEMP}/sdk${sdk}"
            ( cd "${RUNNER_TEMP}/sdk${sdk}" \
              && dotnet new globaljson --sdk-version "${version}" --force \
              && dotnet workload install android )
          done

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 platforms;android-35 platforms;android-36'

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Enable KVM
        # The x86_64 emulator is unusably slow without hardware acceleration, and the runner image
        # does not grant access to /dev/kvm by default.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space
        # The API-35 emulator refuses to start without ~7.2 GB free for its userdata partition
        # ("FATAL | Not enough space to create userdata partition"), and after the SDKs, workloads
        # and Android platforms above, the runner image sits right at that line. Deleting
        # toolchains this job never touches buys ~10 GB of headroom.
        run: |
          df -h /
          sudo rm -rf /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - name: Resolve this leg's package version
        # In its own step rather than inside the emulator action's script: the action runs its
        # script with /usr/bin/sh, and pins.sh is bash (set -o pipefail). run: steps default to
        # bash, and the resolved version crosses over through GITHUB_ENV.
        run: |
          . ./build/pins.sh
          echo "OPENTOK_E2E_VERSION=${OPENTOK_PACKAGE_VERSION}${{ inputs.suffix != '' && format('-{0}', inputs.suffix) || '' }}" >> "$GITHUB_ENV"

      - name: Run smoke tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.e2e-api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./.github/scripts/run-emulator-tests.sh "$OPENTOK_E2E_VERSION" "${{ matrix.target-framework }}"

      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-logs-${{ matrix.target-framework }}
          path: emulator-tests.log
          if-no-files-found: ignore
          retention-days: 7
